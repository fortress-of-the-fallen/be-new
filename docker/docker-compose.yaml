services:
   mongo:
      image: mongo:6.0
      restart: always
      ports:
         - '27017:27017'
      environment:
         MONGO_INITDB_ROOT_USERNAME: root
         MONGO_INITDB_ROOT_PASSWORD: 123123123
         MONGO_INITDB_DATABASE: fortress_of_the_fallen
      command: >
         bash -c "
           cp /etc/mongo-keyfile/keyfile /tmp/mongo-keyfile &&
           chown 999:999 /tmp/mongo-keyfile &&
           chmod 400 /tmp/mongo-keyfile &&
           exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile --auth
         "
      volumes:
         - ./data/mongo:/data/db
         - ./mongo/keyfile:/etc/mongo-keyfile/keyfile:ro
      healthcheck:
         test:
            [
               'CMD-SHELL',
               'mongosh --quiet --host localhost --port 27017 -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep 1 >/dev/null',
            ]
         interval: 5s
         timeout: 5s
         retries: 30
      networks:
         - fotff
      extra_hosts:
         - 'host.docker.internal:host-gateway'

   mongo-rs-init:
      image: mongo:6.0
      restart: 'no'
      depends_on:
         mongo:
            condition: service_healthy
      environment:
         MONGO_ROOTUSER: root
         MONGO_ROOTPASSWORD: 123123123
      entrypoint: >
         bash -c "
           mongosh --quiet --host mongo --port 27017 -u $$MONGO_ROOTUSER -p $$MONGO_ROOTPASSWORD --authenticationDatabase admin --eval '
             try {
               rs.status();
             } catch (e) {
               rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"127.0.0.1:27017\" }] });
             }
           ';
         "
      networks:
         - fotff

   redis:
      image: redis/redis-stack:latest
      ports:
         - '6379:6379'
         - '8011:8001'
      networks:
         - fotff
      extra_hosts:
         - 'host.docker.internal:host-gateway'

   minio:
      image: minio/minio:RELEASE.2023-03-20T20-16-18Z
      ports:
         - '9000:9000'
         - '9001:9001'
      volumes:
         - ./data/minio_data:/data
      environment:
         MINIO_ROOT_USER: admin
         MINIO_ROOT_PASSWORD: Password@1234
      command: server /data --console-address ":9001"

   mc-init:
      image: minio/mc
      depends_on:
         - minio
      entrypoint: >
         /bin/sh -c "
           sleep 5;
           mc alias set myminio http://minio:9000 admin Password@1234 &&
           mc mb myminio/fotff || true &&
           mc admin user add myminio appuser appsecret &&
           mc admin policy attach myminio readwrite --user appuser
           echo '✅ MinIO user created';
         "

networks:
   fotff:
