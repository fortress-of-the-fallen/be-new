services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123123123
      MONGO_INITDB_DATABASE: fortress_of_the_fallen
    command: >
      bash -c "
        cp /etc/mongo-keyfile/keyfile /tmp/mongo-keyfile &&
        chown 999:999 /tmp/mongo-keyfile &&
        chmod 400 /tmp/mongo-keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile --auth
      "
    volumes:
      - ./docker/data/mongo:/data/db
      - ./docker/mongo/keyfile:/etc/mongo-keyfile/keyfile:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost --port 27017 -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1 >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - fotff

  mongo-rs-init:
    image: mongo:6.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOTUSER: root
      MONGO_ROOTPASSWORD: 123123123
    entrypoint: >
      bash -c "
        mongosh --quiet --host mongo --port 27017 -u $$MONGO_ROOTUSER -p $$MONGO_ROOTPASSWORD --authenticationDatabase admin --eval '
          try {
            rs.status();
          } catch (e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"127.0.0.1:27017\" }] });
          }
        ';
      "
    networks:
      - fotff

  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    networks:
      - fotff

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    volumes:
      - ./docker/data/minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Password@1234
    command: server /data --console-address ":9001"
    networks:
      - fotff

  mc-init:
    image: minio/mc
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 admin Password@1234 &&
        mc mb myminio/fotff || true &&
        mc admin user add myminio appuser appsecret || true &&
        mc admin policy attach myminio readwrite --user appuser || true
      "
    networks:
      - fotff

  web:
    build:
      context: .
      dockerfile: /home/mk/Documents/Github/Fotf/be-new/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      mongo-rs-init:
        condition: service_completed_successfully
      mc-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      MONGO_CONNECTIONURL: mongodb://root:123123123@mongo:27017
      MONGO_BASEDBNAME: BaseDatabase
      MONGO_UNIVERSALDBNAME: UniversalDatabase
      MONGO_AGENDADBNAME: AgendaDatabase
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MINIO_URL: http://minio:9000
      MINIO_ROOTUSER: admin
      MINIO_ROOTPASSWORD: Password@1234
      MINIO_USER: appuser
      MINIO_USERPASSWORD: appsecret
      MINIO_BUCKET: fotf
      SMTP_USER: "..."
      SMTP_PASS: "..."
    command:
      - /bin/sh
      - -c
      - |
        NODE_PATH=/usr/src/app/dist node /usr/src/app/dist/src/main.js
    networks:
      - fotff

  ngrok:
    image: ngrok/ngrok:latest
    restart: "no"
    depends_on:
      web:
        condition: service_started
    command:
      - "http"
      - "web:3000"
      - "--url=preferably-upright-walleye.ngrok-free.app"
    environment:
      NGROK_AUTHTOKEN: 2vYjT5j40edREjK6Qbpysfr5TyK_4qhEj643Y4rxNCHoM1wPo
    networks:
      - fotff

networks:
  fotff:
